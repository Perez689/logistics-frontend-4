<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFRC Safekeep Admin Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); }
        .toast { position: fixed; bottom: 6; right: 6; z-index: 50; }
    </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100">
    <div class="fixed top-0 inset-x-0 bg-slate-900 border-b border-slate-700 z-30">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-red-600 rounded flex items-center justify-center text-white"><i class="fa-solid fa-plus"></i></div>
                <span class="font-bold text-lg">IFRC Safekeep Admin</span>
            </div>
            <button id="logoutBtn" class="hidden bg-slate-800 hover:bg-slate-700 text-sm font-medium px-4 py-2 rounded border border-slate-600">Sign Out</button>
        </div>
    </div>

    <div id="loginGateway" class="w-full max-w-md my-auto pt-24 pb-10 px-4">
        <div class="glass-panel rounded-2xl p-8">
            <h1 class="text-2xl font-bold text-center mb-6">Admin Access</h1>
            <div id="adminErrorMsg" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500 text-red-400 text-sm text-center rounded"></div>
            <form id="adminLoginForm" class="space-y-4">
                <div><label class="block text-sm font-semibold">Username</label><input type="text" id="adminUsername" required value="admin" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 text-sm focus:border-red-500 outline-none"></div>
                <div><label class="block text-sm font-semibold">Password</label><input type="password" id="adminPassword" required value="admin123" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 text-sm focus:border-red-500 outline-none"></div>
                <button type="submit" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg">Login</button>
            </form>
        </div>
    </div>

    <div id="adminDashboard" class="hidden w-full max-w-7xl px-4 pt-24 pb-12 space-y-6 mx-auto">
        <div class="flex gap-4 border-b border-slate-700 pb-2">
            <button onclick="showSection('consignments')" id="tab-consignments" class="text-red-400 font-bold border-b-2 border-red-500 pb-2">Maritime Consignments</button>
            <button onclick="showSection('messages')" id="tab-messages" class="text-slate-400 font-bold pb-2">Customer Messages</button>
        </div>

        <div id="section-consignments" class="space-y-6">
            <div class="glass-panel rounded-xl p-6 flex items-center justify-between">
                <div><h3 class="text-lg font-bold">One-Click Test</h3><p class="text-sm text-slate-400">Create a test shipment instantly.</p></div>
                <button onclick="initializeTestShipment()" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg font-bold"><i class="fa-solid fa-flask mr-2"></i>Initialize Test</button>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="glass-panel rounded-xl p-6">
                    <h3 class="text-lg font-bold mb-4"><i class="fa-solid fa-file-circle-plus text-red-500"></i> New Maritime Consignment</h3>
                    <form id="createWaybillForm" class="space-y-3">
                        <input name="waybillId" placeholder="Bill of Lading (B/L) ID" required class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-2 text-sm">
                        <input name="owner" placeholder="Consignee Name" required class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-2 text-sm">
                        <input name="route" placeholder="Sea Route (e.g. Port Sudan → LA)" required class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-2 text-sm">
                        <input name="pin" placeholder="Client PIN" required class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-2 text-sm">
                        <button type="submit" class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg">Create</button>
                    </form>
                </div>
                <div class="glass-panel rounded-xl p-6">
                    <h3 class="text-lg font-bold mb-4"><i class="fa-solid fa-pen-to-square text-red-500"></i> Add Voyage Telemetry</h3>
                    <form id="addEventForm" class="space-y-3">
                        <select id="eventWaybillSelect" required class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-2 text-sm"><option value="">Select B/L...</option></select>
                        <div class="grid grid-cols-2 gap-2">
                            <input name="day" placeholder="Day" type="number" required class="bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm">
                            <input name="date" placeholder="Date (YYYY-MM-DD)" type="date" required class="bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm">
                        </div>
                        <input name="sector" placeholder="Oceanic Sector" required class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm">
                        <input name="knots" placeholder="Speed (KTS)" type="number" step="0.1" required class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm">
                        <input name="seaState" placeholder="Sea State" class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm">
                        <input name="title" placeholder="Event Title" required class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm">
                        <textarea name="text" placeholder="Detailed log text" required class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm h-16"></textarea>
                        <div class="grid grid-cols-2 gap-2">
                            <input name="lat" placeholder="Latitude" class="bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm">
                            <input name="lon" placeholder="Longitude" class="bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm">
                        </div>
                        <select name="status" required class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm">
                            <option value="EN ROUTE">EN ROUTE</option>
                            <option value="DELAYED">DELAYED</option>
                            <option value="ON HOLD">ON HOLD</option>
                            <option value="ARRIVED">ARRIVED</option>
                        </select>
                        <button type="submit" class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg">Publish Event</button>
                    </form>
                </div>
            </div>
            <div class="glass-panel rounded-xl p-6">
                <h3 class="text-lg font-bold mb-4"><i class="fa-solid fa-list-check text-red-500"></i> Active Maritime Consignments</h3>
                <div id="waybillListContainer" class="space-y-4"></div>
            </div>
        </div>

        <div id="section-messages" class="hidden space-y-4">
            <div class="glass-panel rounded-xl p-6">
                <h3 class="text-lg font-bold mb-4">Customer Care Center (Red Cross Safekeep.dpt)</h3>
                <div id="messageContainer" class="space-y-4">
                    <p class="text-slate-400">No messages yet.</p>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden bg-red-600 text-white px-6 py-3 rounded-lg shadow-lg text-sm font-medium"></div>

    <script>
        const API_BASE = 'https://logistics-backend-production-c52f.up.railway.app';
        let token = localStorage.getItem('adminToken');

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast'); t.innerText = msg;
            t.className = `toast ${type === 'success' ? 'bg-green-600' : 'bg-red-600'} text-white px-6 py-3 rounded-lg shadow-lg text-sm font-medium`;
            t.classList.remove('hidden'); setTimeout(() => t.classList.add('hidden'), 3000);
        }

        function showSection(section) {
            if (section === 'consignments') { document.getElementById('section-consignments').classList.remove('hidden'); document.getElementById('section-messages').classList.add('hidden'); document.getElementById('tab-consignments').className = 'text-red-400 font-bold border-b-2 border-red-500 pb-2'; document.getElementById('tab-messages').className = 'text-slate-400 font-bold pb-2'; }
            else { document.getElementById('section-messages').classList.remove('hidden'); document.getElementById('section-consignments').classList.add('hidden'); document.getElementById('tab-messages').className = 'text-red-400 font-bold border-b-2 border-red-500 pb-2'; document.getElementById('tab-consignments').className = 'text-slate-400 font-bold pb-2'; loadMessages(); }
        }

        if (token) { document.getElementById('loginGateway').classList.add('hidden'); document.getElementById('adminDashboard').classList.remove('hidden'); document.getElementById('logoutBtn').classList.remove('hidden'); loadWaybills(); }

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('adminUsername').value, password: document.getElementById('adminPassword').value }) });
                const data = await res.json(); if (!res.ok) throw new Error(data.error);
                token = data.token; localStorage.setItem('adminToken', token);
                document.getElementById('loginGateway').classList.add('hidden'); document.getElementById('adminDashboard').classList.remove('hidden'); document.getElementById('logoutBtn').classList.remove('hidden');
                loadWaybills(); showToast('Logged in');
            } catch (err) { document.getElementById('adminErrorMsg').innerText = err.message; document.getElementById('adminErrorMsg').classList.remove('hidden'); }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => { localStorage.removeItem('adminToken'); location.reload(); });

        async function loadWaybills() {
            const res = await fetch(`${API_BASE}/api/admin/waybills`, { headers: { 'Authorization': `Bearer ${token}` } });
            const list = await res.json(); const select = document.getElementById('eventWaybillSelect'); select.innerHTML = '<option value="">Select B/L...</option>';
            const container = document.getElementById('waybillListContainer'); container.innerHTML = '';
            for (const w of list) {
                select.innerHTML += `<option value="${w.waybillId}">${w.waybillId} - ${w.owner}</option>`;
                const detailRes = await fetch(`${API_BASE}/api/admin/waybills/${w.waybillId}`, { headers: { 'Authorization': `Bearer ${token}` } });
                const full = await detailRes.json(); const card = document.createElement('div'); card.className = 'glass-panel rounded-lg p-4 border-l-4 border-l-red-500';
                let eventsHtml = ''; if (full.events && full.events.length > 0) { eventsHtml = full.events.map((ev, idx) => `<div class="flex justify-between items-center bg-slate-800 p-2 rounded mt-1 text-xs border border-slate-600"><div><strong>Day ${ev.day}</strong> - ${ev.title || ev.sector}</div><div class="flex gap-2"><button onclick="editEvent('${w.waybillId}', ${idx})" class="text-blue-400"><i class="fa-regular fa-pen-to-square"></i></button><button onclick="deleteEvent('${w.waybillId}', ${idx})" class="text-red-400"><i class="fa-regular fa-trash-can"></i></button></div></div>`).join(''); } else { eventsHtml = '<p class="text-xs text-slate-500 italic">No events yet</p>'; }
                card.innerHTML = `<div class="flex justify-between items-start"><div><p class="font-bold text-sm">${w.waybillId}</p><p class="text-xs text-slate-400">${w.owner}</p><p class="text-xs text-slate-500">${w.route}</p></div></div><div class="mt-2 space-y-1">${eventsHtml}</div>`;
                container.appendChild(card);
            }
        }

        document.getElementById('createWaybillForm').addEventListener('submit', async (e) => {
            e.preventDefault(); const formData = new FormData(e.target); const data = Object.fromEntries(formData.entries());
            try { const res = await fetch(`${API_BASE}/api/admin/waybills`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify(data) }); if (!res.ok) throw new Error('Failed'); showToast('Created'); e.target.reset(); loadWaybills(); } catch (err) { showToast(err.message, 'error'); }
        });

        document.getElementById('addEventForm').addEventListener('submit', async (e) => {
            e.preventDefault(); const formData = new FormData(e.target); const data = Object.fromEntries(formData.entries());
            const waybillId = data.waybillId; delete data.waybillId; data.day = parseInt(data.day); data.knots = parseFloat(data.knots);
            if (!data.seaState) delete data.seaState; if (!data.lat) delete data.lat; if (!data.lon) delete data.lon;
            try { const res = await fetch(`${API_BASE}/api/admin/waybills/${waybillId}/events`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify(data) }); if (!res.ok) throw new Error('Failed'); showToast('Event added'); e.target.reset(); document.getElementById('eventWaybillSelect').value = waybillId; loadWaybills(); } catch (err) { showToast(err.message, 'error'); }
        });

        async function initializeTestShipment() {
            const waybillId = 'IFRC-2026-TEST'; const pin = 'track2026';
            try { await fetch(`${API_BASE}/api/admin/waybills`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ waybillId, owner: 'Dr. Fernando Marcos Perez', route: 'Port Sudan → Los Angeles', pin }) });
            const events = [ { day: 1, date: "2026-08-16", sector: "Red Sea", knots: 16, title: "Departure", text: "Shipment initiated.", status: "EN ROUTE" }, { day: 9, date: "2026-08-24", sector: "Arabian Sea", knots: 21, title: "Deep Water", text: "At sea.", status: "EN ROUTE" }, { day: 10, date: "2026-08-25", sector: "Arabian Sea", knots: 20, title: "Advancing", text: "Moving forward.", status: "EN ROUTE" } ];
            for (const event of events) { await fetch(`${API_BASE}/api/admin/waybills/${waybillId}/events`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify(event) }); }
            showToast('Test created'); loadWaybills(); } catch (err) { showToast(err.message, 'error'); }
        }

        async function loadMessages() {
            const res = await fetch(`${API_BASE}/api/admin/messages`, { headers: { 'Authorization': `Bearer ${token}` } });
            const list = await res.json(); const container = document.getElementById('messageContainer'); container.innerHTML = '';
            if (list.length === 0) { container.innerHTML = '<p class="text-slate-400">No messages yet.</p>'; return; }
            list.forEach(msg => { const div = document.createElement('div'); div.className = 'bg-slate-800 p-4 rounded-lg border border-slate-600'; div.innerHTML = `<div class="flex justify-between"><span class="font-bold text-red-400">${msg.senderName}</span><span class="text-xs text-slate-500">${new Date(msg.date).toLocaleString()}</span></div><p class="text-xs text-slate-400">Consignment: ${msg.consignmentId} | Email: ${msg.senderEmail}</p><p class="text-sm mt-2">${msg.message}</p>${msg.response ? `<div class="mt-2 p-2 bg-slate-900 rounded text-green-400 text-xs">Response: ${msg.response}</div>` : `<div class="mt-2 flex gap-2"><input type="text" id="reply-${msg._id}" placeholder="Type response..." class="bg-slate-900 border border-slate-600 rounded px-3 py-1 text-xs flex-1"><button onclick="replyMessage('${msg._id}')" class="bg-red-600 px-3 py-1 rounded text-xs">Send</button></div>`}`; container.appendChild(div); });
        }

        async function replyMessage(id) {
            const input = document.getElementById(`reply-${id}`); if (!input.value) return;
            await fetch(`${API_BASE}/api/admin/messages/${id}/reply`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ response: input.value }) });
            showToast('Response sent'); loadMessages();
        }

        async function editEvent(waybillId, idx) {
            const res = await fetch(`${API_BASE}/api/admin/waybills/${waybillId}`, { headers: { 'Authorization': `Bearer ${token}` } });
            const full = await res.json(); const ev = full.events[idx]; const newTitle = prompt('Edit:', ev.title);
            if (newTitle !== null) { ev.title = newTitle; full.events[idx] = ev; await fetch(`${API_BASE}/api/admin/waybills/${waybillId}/events`, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ events: full.events }) }); loadWaybills(); }
        }

        async function deleteEvent(waybillId, idx) {
            if (!confirm('Delete?')) return; const res = await fetch(`${API_BASE}/api/admin/waybills/${waybillId}`, { headers: { 'Authorization': `Bearer ${token}` } }); const full = await res.json(); full.events.splice(idx, 1); await fetch(`${API_BASE}/api/admin/waybills/${waybillId}/events`, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ events: full.events }) }); loadWaybills();
        }
    </script>
</body>
</html>
